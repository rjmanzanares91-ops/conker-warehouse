<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevamiento de depósito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#E4E6E8; --paper:#F4F5F6; --ink:#1B2028; --muted:#5E6875;
  --rack:#1F4E8C; --beam:#E8710A; --tape:#F2C200; --ok:#2E7D4F; --line:#C3C8CE; --danger:#B3261E;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --stencil:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.hwrap{max-width:1200px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px}
header h1{margin:0;font:700 26px/1 var(--stencil);letter-spacing:.02em}
.hstat{font-size:14px;color:#C9CED6;margin-left:auto}
nav{max-width:1200px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#B7BEC8;padding:12px 14px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tape)}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
h2{margin:0 0 6px;font:700 28px/1.1 var(--stencil);letter-spacing:.01em}
h3{margin:0 0 8px;font-size:18px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.note{background:#FFF6D6;border-left:6px solid var(--tape);padding:10px 14px;margin:0 0 16px}
.note.err{background:#FBE4E2;border-left-color:var(--danger)}

.btn{background:var(--ink);color:#fff;border:0;padding:10px 16px;font-weight:600;border-radius:3px;min-height:44px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.tape{background:var(--tape);color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:2px solid var(--danger)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input,select{border:2px solid var(--line);background:#fff;padding:8px 10px;border-radius:3px;min-height:44px}
input[type=number]{width:96px}
input:focus,select:focus{border-color:var(--rack)}

/* layout table */
table{border-collapse:collapse;width:100%;max-width:640px;background:#fff}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:14px;font-weight:600;color:var(--muted)}
td.pl{font:700 26px/1 var(--stencil);width:70px}
td input{width:80px;min-height:38px;padding:4px 8px}

/* aisles */
.aisle{display:flex;gap:12px;margin:0 0 18px;align-items:stretch}
.aletter{flex:0 0 58px;background:var(--tape);color:var(--ink);font:700 54px/1 var(--stencil);display:flex;align-items:center;justify-content:center;border-radius:2px}
.ascroll{overflow-x:auto;flex:1;padding-bottom:4px}
.agrid{display:grid;gap:3px;grid-template-columns:34px repeat(var(--cols),minmax(var(--cw,46px),1fr));min-width:min-content}
.rh,.lh{font-size:12px;color:var(--muted);text-align:center;align-self:center}
.lh{text-align:right;padding-right:4px}
.pisos{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;align-items:center}
.pisos .lh{width:34px}
.pisos .cell{width:var(--cw,46px)}
.cell{min-height:40px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;border-radius:2px;padding:0;position:relative;color:var(--ink)}
.big{--cw:52px}
.big .cell{min-height:52px;font-size:15px}
.cell.un{background:repeating-linear-gradient(135deg,#D9DCE0 0 6px,#ECEEF0 6px 12px);color:var(--muted)}
.cell.vac{background:#fff;color:var(--muted)}
.cell.spl{background:#E9DDF3;color:#4B2069;border-color:#B9A0CF}
.cell.per{background:#D3ECEF;color:#0B5561;border-color:#93C4CB}
.cell.loose{box-shadow:inset 0 -6px 0 var(--tape)}
.cell.sel{outline:4px solid var(--beam);outline-offset:1px;z-index:2}
.cell.hit{outline:3px solid #000;outline-offset:1px;z-index:2}
.cell.dim{opacity:.22}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:3px;padding:4px 10px;min-width:64px;text-align:center}
.chip b{display:block;font:700 24px/1 var(--stencil)}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--tape)}
.chip.done small{color:var(--ok);font-weight:600}

.bar{height:10px;background:var(--concrete);border-radius:2px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}

.editor{background:#fff;border:2px solid var(--ink);padding:14px;margin-top:8px;max-width:640px}
.items{list-style:none;margin:0 0 12px;padding:0}
.items li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.items li span{flex:1}

.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin:6px 0 16px}
.kpi b{display:block;font:700 34px/1 var(--stencil)}
.kpi small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 0 14px;align-items:center;max-height:132px;overflow:auto}
.sw{display:inline-block;width:16px;height:16px;border:1px solid var(--line);vertical-align:-3px;margin-right:6px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:6px solid var(--tape);box-shadow:0 -8px 24px rgba(0,0,0,.18);max-height:46vh;overflow:auto;padding:14px 18px}
.sheet .in{max-width:1200px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:3px;z-index:50;max-width:90vw}
.lotes{margin:0 0 14px;padding:0;list-style:none}
.lotes li{padding:6px 0;border-bottom:1px solid var(--line)}
.det{--cw:120px}
.det .cell{display:flex;flex-direction:column;align-items:stretch;overflow:hidden;text-align:left;min-height:48px}
.det .cell.multi{background:#fff}
.det .ctr{margin:auto;text-align:center;font-size:13px;font-weight:600;padding:2px 4px}
.det .ctr small{display:block;font-weight:400;font-size:11px}
.band{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3px 7px;color:#fff;min-height:46px;border-bottom:1px solid rgba(255,255,255,.4)}
.band:last-child{border-bottom:0}
.band .l1{display:flex;justify-content:space-between;gap:6px;font-size:13px;line-height:1.25}
.band .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .l1 i{font-style:normal;font-weight:700}
.band .l2{font-size:11px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.band.piso{box-shadow:inset 0 -5px 0 var(--tape)}
.band.mas{background:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
@media (max-width:560px){h2{font-size:24px}.aletter{flex-basis:44px;font-size:42px}}
</style>
</head>
<body>
<header>
  <div class="hwrap"><h1>Relevamiento de depósito</h1><div class="hstat" id="hstat"></div></div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileimp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ Constantes y estado ============ */
const KEY = 'deposito-v2';
const REF_TOTAL = 952;                       // referencia del calculador de capacidad (pasillos A–N + R)
const OPERADORES = ['Fabio','Jose','Leo','Temporario'];
const PCOL = ['#1F4E8C','#7B3FA0','#2E7D4F','#B5651D','#0F7C8C','#8A8F98','#A32C55','#4C6B1F'];

function defaultState(){
  const ids = 'ABCDEFGHIJKLMN'.split('').concat(['R']);
  return { v:2,
    layout:{ confirmado:false, pasillos: ids.map(id=>({id, racks:8, niveles:3, pisos:0})) },
    productos:['RUGS','MOD','Cortinas de baño','Textiles','Otro'],
    sesiones:[], activaId:null };
}
function migrate(o){
  (o.sesiones||[]).forEach(s=>Object.values(s.registros||{}).forEach(r=>{
    if(!r.tipo) r.tipo = r.vacia ? 'vacia' : 'lotes';
    delete r.vacia;
    (r.items||[]).forEach(i=>{
      if(i.lote!==undefined && i.codigo===undefined){ i.codigo=i.lote; delete i.lote; }
      if(i.ct===undefined) i.ct='';
      if(i.estado==='suelto') i.estado='piso';
    });
  }));
  return o;
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.v===2) return migrate(o); } }catch(e){} return null; }
let S = load() || defaultState();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar en este navegador. Exportá un respaldo desde la pestaña Datos.'); } }

const UI = { tab: S.layout.confirmado ? 'relevar' : 'layout', pasillo:null, pos:null,
  draft:{items:[], codigo:'', ct:'', producto:'', cajas:'', estado:'pallet', comentario:''},
  mapSes:null, mapMode:'estado', mapView:'detalle', q:'', detail:null };

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const fmt = ts => new Date(ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }

/* ============ Modelo de posiciones ============ */
const keyRack = (p,r,n) => `${p.id}-${pad2(r)}-N${n}`;
const keyPiso = (p,k)   => `${p.id}-P${pad2(k)}`;
const countP  = p => p.racks*p.niveles + p.pisos;
const totalPos = () => S.layout.pasillos.reduce((a,p)=>a+countP(p),0);
function keysOf(p){
  const out=[];
  for(let r=1;r<=p.racks;r++) for(let n=1;n<=p.niveles;n++) out.push(keyRack(p,r,n));
  for(let k=1;k<=p.pisos;k++) out.push(keyPiso(p,k));
  return out;
}
function allKeys(){ return S.layout.pasillos.flatMap(keysOf); }
function labelOf(key){
  const q=key.split('-');
  if(q.length===3) return `Pasillo ${q[0]} · Rack ${q[1]} · Nivel ${q[2].slice(1)}`;
  return `Pasillo ${q[0]} · Piso ${q[1].slice(1)}`;
}
const isFloorLevel = key => /-N1$/.test(key) || /-P\d+$/.test(key);

/* ============ Sesiones ============ */
const ses = () => S.sesiones.find(x=>x.id===S.activaId) || null;
function mapSession(){ return S.sesiones.find(x=>x.id===UI.mapSes) || ses() || S.sesiones[S.sesiones.length-1] || null; }
function doneCount(s, keys){ return keys.reduce((a,k)=>a+(s.registros[k]?1:0),0); }
const totalCajas = rec => rec.items.reduce((a,i)=>a+i.cajas,0);

/* ============ Grilla de pasillo ============ */
const SIN_CT='(sin CT)';
function valueOf(item, mode){
  if(mode==='codigo') return item.codigo;
  if(mode==='ct') return item.ct || SIN_CT;
  return item.producto;
}
/* Color estable por valor: se asigna en orden de aparición, así un valor no cambia de color al cargar otros nuevos */
function colorMap(s, mode){
  const m=new Map();
  if(!s || mode==='estado') return m;
  Object.values(s.registros).sort((a,b)=>a.ts-b.ts).forEach(r=>r.items.forEach(i=>{
    const v=valueOf(i,mode);
    if(!m.has(v)) m.set(v, v===SIN_CT ? '#8A8F98' : `hsl(${Math.round((m.size*137.508)%360)},58%,40%)`);
  }));
  return m;
}
function colorFor(mode, rec, cmap){
  if(!rec) return {cls:'un', style:''};
  if(rec.tipo==='vacia') return {cls:'vac', style:''};
  if(rec.tipo==='samples') return {cls:'spl', style:''};
  if(rec.tipo==='personales') return {cls:'per', style:''};
  if(mode==='estado' || !cmap) return {cls:'', style:'background:var(--rack);color:#fff'};
  const cols=[...new Set(rec.items.map(i=>valueOf(i,mode)))].map(v=>cmap.get(v)||'#888').slice(0,3);
  if(cols.length===1) return {cls:'', style:`background:${cols[0]};color:#fff`};
  const w=100/cols.length;
  const stops=cols.map((c,i)=>`${c} ${(i*w).toFixed(1)}% ${((i+1)*w).toFixed(1)}%`).join(',');
  return {cls:'', style:`background:linear-gradient(90deg,${stops});color:#fff;text-shadow:0 0 3px #000,0 0 3px #000`};
}
/* Vista Detalle: una banda por lote (hasta 3; con 4 o más: 2 bandas y "+N más") */
function bandsHTML(rec, mode, cmap){
  const it=rec.items, max=3;
  const show = it.length<=max ? it : it.slice(0,max-1);
  let out = show.map(i=>{
    const col = mode==='estado' ? 'var(--rack)' : (cmap&&cmap.get(valueOf(i,mode))||'#888');
    return `<span class="band${i.estado==='piso'?' piso':''}" style="background:${col}"><span class="l1"><b>${esc(i.codigo)}</b><i>${i.cajas}</i></span>${i.ct?`<span class="l2">CT ${esc(i.ct)}</span>`:''}</span>`;
  }).join('');
  if(it.length>max){
    const rest=it.slice(max-1), sum=rest.reduce((a,i)=>a+i.cajas,0);
    out += `<span class="band mas"><span class="l1"><b>+${rest.length} más</b><i>${sum}</i></span></span>`;
  }
  return out;
}
function cellHTML(key, s, mode, ctx){
  const rec = s ? s.registros[key] : null;
  const c = colorFor(mode, rec, ctx.cmap);
  let cls = 'cell '+c.cls, txt = '', style = c.style;
  const det = !!ctx.detalle;
  if(rec && rec.tipo==='lotes'){
    if(det){ txt = bandsHTML(rec, mode, ctx.cmap); style=''; cls+=' multi'; }
    else { txt = totalCajas(rec); if(rec.items.some(i=>i.estado==='piso')) cls+=' loose'; }
  }
  else if(rec && rec.tipo==='vacia') txt = det ? '<span class="ctr">vacía</span>' : '–';
  else if(rec && rec.tipo==='samples') txt = det ? `<span class="ctr">Samples${rec.comentario?'<small>'+esc(rec.comentario)+'</small>':''}</span>` : 'S';
  else if(rec && rec.tipo==='personales') txt = det ? '<span class="ctr">Art. personales</span>' : 'AP';
  if(ctx.sel===key) cls+=' sel';
  if(ctx.hits){ cls += ctx.hits.has(key) ? ' hit' : ' dim'; }
  let title = labelOf(key);
  if(!rec) title += ' — sin relevar';
  else if(rec.tipo==='lotes') title += ' — ' + rec.items.map(i=>`${i.codigo}${i.ct?' / CT '+i.ct:''} (${i.producto}, ${i.cajas} cajas, ${i.estado==='piso'?'en piso':'en pallet'})`).join('; ');
  else if(rec.tipo==='vacia') title += ' — vacía';
  else if(rec.tipo==='samples') title += ' — samples'+(rec.comentario?': '+rec.comentario:'');
  else title += ' — artículos personales';
  return `<button class="${cls}" style="${style}" data-act="${ctx.act}" data-pos="${key}" title="${esc(title)}" aria-label="${esc(title)}">${txt}</button>`;
}
function aisleHTML(p, s, mode, ctx){
  let g = `<div class="agrid" style="--cols:${p.racks}"><span></span>`;
  for(let r=1;r<=p.racks;r++) g += `<span class="rh">${pad2(r)}</span>`;
  for(let n=p.niveles;n>=1;n--){
    g += `<span class="lh">N${n}</span>`;
    for(let r=1;r<=p.racks;r++) g += cellHTML(keyRack(p,r,n), s, mode, ctx);
  }
  g += '</div>';
  let pis = '';
  if(p.pisos>0){
    pis = '<div class="pisos"><span class="lh">Piso</span>';
    for(let k=1;k<=p.pisos;k++) pis += cellHTML(keyPiso(p,k), s, mode, ctx);
    pis += '</div>';
  }
  return `<div class="aisle${ctx.detalle?' det':''}"><div class="aletter" aria-label="Pasillo ${p.id}">${esc(p.id)}</div><div class="ascroll">${g}${pis}</div></div>`;
}

/* ============ Render principal ============ */
const TABS = [['layout','Layout'],['relevar','Relevar'],['mapa','Mapa'],['datos','Datos']];
function render(){
  $('#tabs').innerHTML = TABS.map(([id,t])=>`<button role="tab" aria-selected="${UI.tab===id}" data-act="tab" data-tab="${id}">${t}</button>`).join('');
  const s=ses();
  $('#hstat').textContent = s ? `Relevando: ${s.operador} · desde ${fmt(s.inicio)}` : 'Sin relevamiento en curso';
  $('#app').innerHTML = ({layout:viewLayout, relevar:viewRelevar, mapa:viewMapa, datos:viewDatos})[UI.tab]();
  if(UI.tab==='relevar' && UI.pos){ const e=$('#editor'); if(e) e.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ============ Vista: Layout ============ */
function layoutSummary(){
  const t=totalPos(), d=t-REF_TOTAL;
  return `<b>${t}</b> posiciones en total. Referencia del calculador de capacidad: ${REF_TOTAL}. ` +
    (d===0 ? '<span style="color:var(--ok);font-weight:600">Coincide.</span>' : `Diferencia: ${d>0?'+':''}${d}.`);
}
function viewLayout(){
  const L=S.layout;
  const rows = L.pasillos.map((p,i)=>`<tr>
    <td class="pl">${esc(p.id)}</td>
    <td><input type="number" min="1" max="80" value="${p.racks}" data-lay="${i}" data-f="racks" aria-label="Racks pasillo ${p.id}"></td>
    <td><input type="number" min="1" max="12" value="${p.niveles}" data-lay="${i}" data-f="niveles" aria-label="Niveles pasillo ${p.id}"></td>
    <td><input type="number" min="0" max="200" value="${p.pisos}" data-lay="${i}" data-f="pisos" aria-label="Posiciones de piso pasillo ${p.id}"></td>
    <td id="lp-${i}">${countP(p)}</td>
    <td><button class="btn alt sm" data-act="delPasillo" data-i="${i}">Quitar</button></td></tr>`).join('');
  return `<h2>Layout del depósito</h2>
  ${L.confirmado ? '' : `<div class="note"><b>Estos valores son de ejemplo.</b> Ajustalos al depósito real antes de confirmar: racks por pasillo, niveles por rack y posiciones de piso fuera de rack.</div>`}
  <p class="muted">Una posición es un nivel de un rack (ej. A-03-N2) o una posición de piso fuera de rack (ej. A-P04). El nivel 1 es el que está al ras del piso.</p>
  <h3>Aplicar a todos los pasillos</h3>
  <div class="row">
    <label class="f">Racks<input type="number" id="b-racks" min="1" max="80" value="8"></label>
    <label class="f">Niveles<input type="number" id="b-niv" min="1" max="12" value="3"></label>
    <label class="f">Pisos<input type="number" id="b-pisos" min="0" max="200" value="0"></label>
    <button class="btn alt" data-act="aplicarTodos">Aplicar a todos</button>
  </div>
  <h3>Por pasillo</h3>
  <table><thead><tr><th>Pasillo</th><th>Racks</th><th>Niveles</th><th>Pisos</th><th>Posiciones</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div class="row" style="margin-top:12px">
    <label class="f">Nuevo pasillo<input type="text" id="np-id" maxlength="4" placeholder="Ej: Ñ" style="width:96px"></label>
    <button class="btn alt" data-act="addPasillo">Agregar pasillo</button>
  </div>
  <p id="lay-total" style="font-size:18px">${layoutSummary()}</p>
  ${S.sesiones.length ? '<div class="note err">Ya hay relevamientos guardados. Si cambiás el layout, las posiciones que dejen de existir no se mostrarán en los relevamientos anteriores.</div>' : ''}
  <button class="btn tape" data-act="confirmLayout">${L.confirmado ? 'Layout confirmado. Ir a relevar' : 'Confirmar layout y empezar'}</button>`;
}

/* ============ Vista: Relevar ============ */
function firstPending(s){
  for(const p of S.layout.pasillos){ const k=keysOf(p).find(k=>!s.registros[k]); if(k) return {p:p.id,k}; }
  return null;
}
function viewRelevar(){
  if(!S.layout.confirmado) return `<h2>Relevar</h2><div class="note">Primero confirmá el layout del depósito.</div><button class="btn" data-act="tab" data-tab="layout">Ir a Layout</button>`;
  const s=ses();
  if(!s){
    const prev = S.sesiones.slice().reverse().map(x=>`<li>${esc(x.operador)} · ${fmt(x.inicio)} · ${doneCount(x,allKeys())} posiciones ${x.fin?'(cerrado)':''}</li>`).join('');
    return `<h2>Relevar</h2>
    <p>Elegí quién va a relevar. Cada relevamiento queda guardado con su fecha y responsable.</p>
    <div class="row"><label class="f">Responsable
      <select id="op">${OPERADORES.map(o=>`<option>${o}</option>`).join('')}</select></label>
      <button class="btn tape" data-act="iniciar">Iniciar relevamiento</button></div>
    ${prev?`<h3>Relevamientos anteriores</h3><ul class="lotes">${prev}</ul>`:''}`;
  }
  const keys=allKeys(), done=doneCount(s,keys), pct=keys.length?Math.round(done/keys.length*100):0;
  if(!UI.pasillo || !S.layout.pasillos.some(p=>p.id===UI.pasillo)){ const fp=firstPending(s); UI.pasillo = fp?fp.p:S.layout.pasillos[0].id; }
  const chips = S.layout.pasillos.map(p=>{
    const ks=keysOf(p), d=doneCount(s,ks);
    return `<button class="chip ${d===ks.length?'done':''}" data-act="pasillo" data-id="${p.id}" aria-pressed="${UI.pasillo===p.id}"><b>${esc(p.id)}</b><small>${d}/${ks.length}</small></button>`;
  }).join('');
  const p=S.layout.pasillos.find(x=>x.id===UI.pasillo);
  return `<h2>Relevando: ${done} de ${keys.length} posiciones</h2>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <div class="chips">${chips}</div>
  <p class="muted">Tocá una posición para cargar lo que hay. Gris rayado: sin relevar. Blanco con guion: vacía. Azul: con mercadería. Franja amarilla: mercadería en piso. S: samples. AP: artículos personales.</p>
  <div class="big">${aisleHTML(p, s, 'estado', {act:'pick', sel:UI.pos})}</div>
  ${UI.pos ? editorHTML(s) : ''}
  <div class="row" style="margin-top:20px"><button class="btn danger" data-act="cerrar">Cerrar relevamiento</button></div>`;
}
const TIPO_TXT={vacia:' como vacía',samples:' como samples',personales:' como artículos personales',lotes:''};
function editorHTML(s){
  const rec=s.registros[UI.pos], d=UI.draft;
  const codigos=new Set(); Object.values(s.registros).forEach(r=>r.items.forEach(i=>codigos.add(i.codigo)));
  const items = d.items.length ? `<ul class="items">${d.items.map((i,n)=>`<li><span><b>${esc(i.codigo)}</b>${i.ct?' · CT '+esc(i.ct):''} · ${esc(i.producto)} · ${i.cajas} cajas · ${i.estado==='piso'?'en piso':'en pallet'}</span><button class="btn alt sm" data-act="delItem" data-i="${n}">Quitar</button></li>`).join('')}</ul>` : '<p class="muted">Todavía no cargaste lotes en esta posición.</p>';
  return `<section class="editor" id="editor">
    <h3>${esc(labelOf(UI.pos))}</h3>
    ${rec ? `<p class="muted">Ya relevada${TIPO_TXT[rec.tipo]} el ${fmt(rec.ts)}${rec.tipo==='samples'&&rec.comentario?' ('+esc(rec.comentario)+')':''}. Si guardás, se reemplaza.</p>`:''}
    ${items}
    <datalist id="codigosdl">${[...codigos].map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
    <datalist id="prodsdl">${S.productos.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div class="row">
      <label class="f">Código<input type="text" id="d-codigo" list="codigosdl" autocomplete="off" autocapitalize="characters" value="${esc(d.codigo)}" data-d="codigo" style="width:170px"></label>
      <label class="f">CT<input type="text" id="d-ct" autocomplete="off" autocapitalize="characters" value="${esc(d.ct)}" data-d="ct" style="width:130px"></label>
      <label class="f">Producto<input type="text" id="d-producto" list="prodsdl" autocomplete="off" value="${esc(d.producto)}" data-d="producto" style="width:190px"></label>
      <label class="f">Cajas<input type="number" id="d-cajas" min="1" inputmode="numeric" value="${esc(d.cajas)}" data-d="cajas"></label>
      <label class="f">Estado<select data-d="estado"><option value="pallet" ${d.estado==='pallet'?'selected':''}>En pallet</option><option value="piso" ${d.estado==='piso'?'selected':''}>En piso</option></select></label>
    </div>
    <div class="row">
      <button class="btn alt" data-act="addItem">Agregar otro lote</button>
      <button class="btn tape" data-act="guardar">Guardar posición y seguir</button>
    </div>
    <h3 style="margin-top:8px">Otras opciones para esta posición</h3>
    <div class="row"><label class="f" style="flex:1;min-width:240px">Comentario (opcional, para samples)<input type="text" id="d-coment" autocomplete="off" value="${esc(d.comentario)}" data-d="comentario" style="width:100%"></label></div>
    <div class="row">
      <button class="btn alt" data-act="vacia">Marcar vacía</button>
      <button class="btn alt" data-act="samples">Marcar samples</button>
      <button class="btn alt" data-act="personales">Marcar artículos personales</button>
      ${rec?'<button class="btn danger" data-act="borrar">Volver a sin relevar</button>':''}
    </div>
  </section>`;
}

/* ============ Vista: Mapa ============ */
function viewMapa(){
  if(!S.sesiones.length) return `<h2>Mapa</h2><div class="note">Todavía no hay relevamientos. Cuando el operador cargue posiciones, se van a ver acá.</div>`;
  const cur=mapSession();
  const opts=S.sesiones.slice().reverse().map(x=>`<option value="${x.id}" ${cur&&cur.id===x.id?'selected':''}>${esc(x.operador)} · ${fmt(x.inicio)}${x.id===S.activaId?' (en curso)':''}</option>`).join('');
  return `<h2>Mapa del depósito</h2>
  <div class="row">
    <label class="f">Relevamiento<select id="m-ses">${opts}</select></label>
    <label class="f">Vista<select id="m-view">
      <option value="detalle" ${UI.mapView==='detalle'?'selected':''}>Detalle</option>
      <option value="compacto" ${UI.mapView==='compacto'?'selected':''}>Compacto</option></select></label>
    <label class="f">Colorear por<select id="m-mode">
      <option value="estado" ${UI.mapMode==='estado'?'selected':''}>Estado</option>
      <option value="ct" ${UI.mapMode==='ct'?'selected':''}>CT</option>
      <option value="codigo" ${UI.mapMode==='codigo'?'selected':''}>Código</option>
      <option value="producto" ${UI.mapMode==='producto'?'selected':''}>Producto</option></select></label>
    <label class="f">Buscar lote<input type="search" id="m-q" value="${esc(UI.q)}" placeholder="Código de lote" autocomplete="off"></label>
  </div>
  <div id="mapbody">${mapBodyHTML()}</div>`;
}
function lotesIndex(s){
  const m=new Map();
  Object.entries(s.registros).forEach(([k,r])=>r.items.forEach(i=>{
    const e=m.get(i.codigo)||{pos:new Set(),cajas:0}; e.pos.add(k); e.cajas+=i.cajas; m.set(i.codigo,e);
  }));
  return m;
}
function mapBodyHTML(){
  const s=mapSession(); if(!s) return '';
  const keys=allKeys(), keySet=new Set(keys);
  const recs=Object.entries(s.registros).filter(([k])=>keySet.has(k));
  const cnt=t=>recs.filter(([,r])=>r.tipo===t).length;
  const done=recs.length, vac=cnt('vacia'), occ=cnt('lotes'), spl=cnt('samples'), per=cnt('personales');
  const usedProds=new Set(); recs.forEach(([,r])=>r.items.forEach(i=>usedProds.add(i.producto)));
  const cajas=recs.reduce((a,[,r])=>a+totalCajas(r),0);
  const cmap=colorMap(s,UI.mapMode);
  const idx=lotesIndex(s), frag=[...idx.values()].filter(e=>e.pos.size>1).length;
  const sueltas=recs.filter(([,r])=>r.items.some(i=>i.estado==='piso')).length;
  const q=UI.q.trim().toUpperCase();
  let hits=null, found='';
  if(q){
    hits=new Set(); const lst=[];
    idx.forEach((e,l)=>{ if(l.toUpperCase().includes(q)){ e.pos.forEach(p=>hits.add(p)); lst.push(`<li><b>${esc(l)}</b>: ${e.cajas} cajas en ${e.pos.size} posición${e.pos.size>1?'es':''} (${[...e.pos].map(esc).join(', ')})</li>`); } });
    found = lst.length ? `<ul class="lotes">${lst.join('')}</ul>` : '<div class="note">No hay lotes que coincidan en este relevamiento.</div>';
  }
  const kp=(n,l)=>`<div class="kpi"><b>${n}</b><small>${l}</small></div>`;
  let legend='';
  if(UI.mapMode==='estado') legend=`<span><i class="sw" style="background:var(--rack)"></i>Con mercadería</span><span><i class="sw" style="background:#fff"></i>Vacía</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,#D9DCE0 0 4px,#ECEEF0 4px 8px)"></i>Sin relevar</span><span><i class="sw" style="box-shadow:inset 0 -6px 0 var(--tape)"></i>Mercadería en piso</span>`;
  else {
    const nom={ct:'CT',codigo:'código',producto:'producto'}[UI.mapMode];
    legend=`<span class="muted">Un color por ${nom}. Si una posición tiene varios, se divide en franjas (hasta 3).</span>`+[...cmap].map(([v,c])=>`<span><i class="sw" style="background:${c}"></i>${esc(v)}</span>`).join('');
  }
  legend+=`<span><i class="sw" style="background:#E9DDF3"></i>Samples (S)</span><span><i class="sw" style="background:#D3ECEF"></i>Artículos personales (AP)</span>`;
  const aisles=S.layout.pasillos.map(p=>aisleHTML(p,s,UI.mapMode,{act:'detail',cmap,hits,sel:UI.detail,detalle:UI.mapView==='detalle'})).join('');
  return `<div class="kpis">
    ${kp(`${done}/${keys.length}`,'posiciones relevadas')}${kp(occ,'con mercadería')}${kp(vac,'vacías')}${kp(cajas,'cajas contadas')}${kp(idx.size,'lotes distintos')}${kp(frag,'lotes en más de una posición')}${kp(sueltas,'posiciones con mercadería en piso')}${kp(spl,'con samples')}${kp(per,'con artículos personales')}
  </div>
  ${found}
  <div class="legend">${legend}</div>
  ${aisles}
  ${UI.detail ? detailHTML(s) : ''}`;
}
function detailHTML(s){
  const rec=s.registros[UI.detail];
  const cuando = rec ? `Relevada el ${fmt(rec.ts)} por ${esc(s.operador)}.` : '';
  let body;
  if(!rec) body='<p class="muted">Sin relevar.</p>';
  else if(rec.tipo==='vacia') body=`<p>Vacía. ${cuando}</p>`;
  else if(rec.tipo==='samples') body=`<p><b>Samples</b>${rec.comentario?': '+esc(rec.comentario):''}. ${cuando}</p>`;
  else if(rec.tipo==='personales') body=`<p><b>Artículos personales.</b> ${cuando}</p>`;
  else {
    const idx=lotesIndex(s);
    body=`<ul class="items">${rec.items.map(i=>{
      const e=idx.get(i.codigo), n=e?e.pos.size:1;
      return `<li><span><b>${esc(i.codigo)}</b>${i.ct?' · CT '+esc(i.ct):''} · ${esc(i.producto)} · ${i.cajas} cajas · ${i.estado==='piso'?'en piso':'en pallet'}${n>1?` · el código está en ${n} posiciones`:''}</span></li>`;}).join('')}</ul><p class="muted">${cuando}</p>`;
  }
  return `<div class="sheet"><div class="in"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${esc(labelOf(UI.detail))}</h3><button class="btn alt sm" data-act="closeDetail">Cerrar</button></div>${body}</div></div>`;
}

/* ============ Vista: Datos ============ */
function viewDatos(){
  return `<h2>Datos</h2>
  <p>Los datos se guardan en este navegador. Exportá un respaldo al terminar cada jornada de relevamiento.</p>
  <div class="row">
    <button class="btn" data-act="exportJSON">Exportar respaldo (JSON)</button>
    <button class="btn alt" data-act="exportCSV">Exportar relevamiento seleccionado (CSV)</button>
    <button class="btn alt" data-act="importJSON">Importar respaldo</button>
  </div>
  <p class="muted">El CSV corresponde al relevamiento elegido en la pestaña Mapa (por defecto, el actual o el último).</p>
  <h3>Borrar todo</h3>
  <p class="muted">Elimina layout, relevamientos y tipos de producto de este navegador.</p>
  <button class="btn danger" data-act="reset">Borrar todos los datos</button>`;
}
function download(name, text, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCSV(){
  const s=mapSession(); if(!s){ toast('No hay relevamientos para exportar.'); return; }
  const rows=[['relevamiento','responsable','posicion','pasillo','rack','nivel','tipo','estado_posicion','codigo','ct','producto','cajas','estado_mercaderia','comentario','fecha']];
  const ETQ={vacia:'vacia',samples:'samples',personales:'articulos personales'};
  allKeys().forEach(k=>{
    const q=k.split('-'), rack=q.length===3, rec=s.registros[k];
    const base=[fmt(s.inicio),s.operador,k,q[0],rack?q[1]:'',rack?q[2].slice(1):'',rack?'rack':'piso'];
    if(!rec) rows.push([...base,'sin relevar','','','','','','','']);
    else if(rec.tipo!=='lotes') rows.push([...base,ETQ[rec.tipo],'','','','','',rec.comentario||'',fmt(rec.ts)]);
    else rec.items.forEach(i=>rows.push([...base,'ocupada',i.codigo,i.ct||'',i.producto,i.cajas,i.estado==='piso'?'en piso':'en pallet','',fmt(rec.ts)]));
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download(`relevamiento_${new Date(s.inicio).toISOString().slice(0,10)}_${s.operador}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');
}

/* ============ Acciones de relevamiento ============ */
function selectPos(key){
  UI.pos=key; const rec=ses().registros[key];
  UI.draft={items: rec&&rec.tipo==='lotes' ? rec.items.map(i=>({...i})) : [], codigo:'', ct:'', producto:'', cajas:'', estado:'pallet',
            comentario: rec&&rec.tipo==='samples' ? (rec.comentario||'') : ''};
  render();
}
function addItem(silent){
  const d=UI.draft, codigo=d.codigo.trim().toUpperCase(), ct=d.ct.trim().toUpperCase(), cajas=parseInt(d.cajas,10);
  let prod=d.producto.trim();
  if(!codigo){ if(!silent) toast('Falta el código.'); return false; }
  if(!prod){ if(!silent) toast('Falta el producto.'); return false; }
  if(!(cajas>0)){ if(!silent) toast('La cantidad de cajas debe ser mayor a 0.'); return false; }
  const ex=S.productos.find(p=>p.toLowerCase()===prod.toLowerCase());
  if(ex) prod=ex; else { S.productos.push(prod); persist(); }
  const ya=lotesIndex(ses()).get(codigo);
  d.items.push({codigo,ct,producto:prod,cajas,estado:d.estado});
  d.codigo=''; d.ct=''; d.cajas='';
  if(ya && !(ya.pos.size===1 && ya.pos.has(UI.pos))) toast(`El código ${codigo} ya figura en ${ya.pos.size} posición${ya.pos.size>1?'es':''} de este relevamiento. Se registra como lote repartido.`);
  return true;
}
function markSpecial(tipo){
  const d=UI.draft;
  if(d.items.length && !confirm('Hay lotes cargados sin guardar en esta posición. Si marcás otra opción se descartan. ¿Continuar?')) return;
  const rec={tipo,items:[],ts:Date.now()};
  if(tipo==='samples') rec.comentario=d.comentario.trim();
  ses().registros[UI.pos]=rec; persist(); nextPos();
}
function nextPos(){
  const s=ses(), p=S.layout.pasillos.find(x=>x.id===UI.pasillo), ks=keysOf(p);
  const i=ks.indexOf(UI.pos);
  let nk=ks.slice(i+1).find(k=>!s.registros[k]) || ks.find(k=>!s.registros[k]);
  if(!nk){ const fp=firstPending(s); if(fp){ UI.pasillo=fp.p; nk=fp.k; } }
  if(nk){ selectPos(nk); }
  else { UI.pos=null; render(); toast('Relevamiento completo. Podés cerrarlo.'); }
}

/* ============ Eventos ============ */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, L=S.layout;
  switch(a){
    case 'tab': UI.tab=b.dataset.tab; if(UI.tab!=='mapa') UI.detail=null; render(); break;
    case 'aplicarTodos': {
      const r=+$('#b-racks').value, n=+$('#b-niv').value, p=+$('#b-pisos').value;
      if(!(r>=1&&n>=1&&p>=0)){ toast('Revisá los valores.'); break; }
      L.pasillos.forEach(x=>{x.racks=r;x.niveles=n;x.pisos=p;}); L.confirmado=false; persist(); render(); break; }
    case 'addPasillo': {
      const id=$('#np-id').value.trim().toUpperCase().replace(/[^A-Z0-9Ñ]/g,'');
      if(!id){ toast('Ingresá el nombre del pasillo (letras o números, sin guiones).'); break; }
      if(L.pasillos.some(x=>x.id===id)){ toast('Ese pasillo ya existe.'); break; }
      L.pasillos.push({id,racks:8,niveles:3,pisos:0}); L.confirmado=false; persist(); render(); break; }
    case 'delPasillo': {
      const i=+b.dataset.i;
      if(S.sesiones.length && !confirm('Hay relevamientos guardados. ¿Quitar el pasillo igual?')) break;
      L.pasillos.splice(i,1); L.confirmado=false; persist(); render(); break; }
    case 'confirmLayout':
      if(!L.pasillos.length){ toast('Agregá al menos un pasillo.'); break; }
      L.confirmado=true; persist(); UI.tab='relevar'; render(); break;
    case 'iniciar': {
      const s={id:'s'+Date.now(), operador:$('#op').value, inicio:Date.now(), fin:null, registros:{}};
      S.sesiones.push(s); S.activaId=s.id; UI.pos=null; UI.pasillo=null; persist(); render(); break; }
    case 'cerrar': {
      const s=ses(), pend=allKeys().length-doneCount(s,allKeys());
      if(!confirm(pend?`Quedan ${pend} posiciones sin relevar. ¿Cerrar igual?`:'¿Cerrar el relevamiento?')) break;
      s.fin=Date.now(); UI.mapSes=s.id; S.activaId=null; UI.pos=null; persist(); UI.tab='mapa'; render(); break; }
    case 'pasillo': UI.pasillo=b.dataset.id; UI.pos=null; render(); break;
    case 'pick': selectPos(b.dataset.pos); break;
    case 'addItem': if(addItem()) render(); break;
    case 'delItem': UI.draft.items.splice(+b.dataset.i,1); render(); break;
    case 'guardar': {
      const d=UI.draft;
      if(d.codigo.trim() || d.ct.trim() || d.cajas){ if(!addItem()) break; }
      if(!d.items.length){ toast('Cargá al menos un lote, o marcá la posición como vacía.'); break; }
      ses().registros[UI.pos]={tipo:'lotes',items:d.items.map(i=>({...i})),ts:Date.now()};
      persist(); nextPos(); break; }
    case 'vacia': markSpecial('vacia'); break;
    case 'samples': markSpecial('samples'); break;
    case 'personales': markSpecial('personales'); break;
    case 'borrar':
      delete ses().registros[UI.pos]; persist(); selectPos(UI.pos); break;
    case 'detail': UI.detail=b.dataset.pos; $('#mapbody').innerHTML=mapBodyHTML(); break;
    case 'closeDetail': UI.detail=null; $('#mapbody').innerHTML=mapBodyHTML(); break;
    case 'exportJSON': download(`deposito_respaldo_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1),'application/json'); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': $('#fileimp').click(); break;
    case 'reset':
      if(confirm('Esto borra todo y no se puede deshacer. ¿Continuar?')){ try{localStorage.removeItem(KEY);}catch(x){} S=defaultState(); UI.tab='layout'; UI.pos=null; UI.pasillo=null; render(); }
      break;
  }
});

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.d && t.dataset.d!=='estado'){ UI.draft[t.dataset.d]=t.value; }
  if(t.id==='m-q'){ UI.q=t.value; $('#mapbody').innerHTML=mapBodyHTML(); }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.lay!==undefined){
    const i=+t.dataset.lay, f=t.dataset.f, lim={racks:[1,80],niveles:[1,12],pisos:[0,200]}[f];
    let v=parseInt(t.value,10); if(isNaN(v)) v=lim[0]; v=Math.min(lim[1],Math.max(lim[0],v)); t.value=v;
    S.layout.pasillos[i][f]=v; S.layout.confirmado=false; persist();
    $('#lp-'+i).textContent=countP(S.layout.pasillos[i]); $('#lay-total').innerHTML=layoutSummary();
  }
  if(t.dataset.d==='estado') UI.draft.estado=t.value;
  if(t.id==='m-ses'){ UI.mapSes=t.value; UI.detail=null; $('#mapbody').innerHTML=mapBodyHTML(); }
  if(t.id==='m-view'){ UI.mapView=t.value; $('#mapbody').innerHTML=mapBodyHTML(); }
  if(t.id==='m-mode'){ UI.mapMode=t.value; $('#mapbody').innerHTML=mapBodyHTML(); }
  if(t.id==='fileimp' && t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const o=JSON.parse(rd.result);
      if(!o||o.v!==2||!o.layout||!Array.isArray(o.sesiones)) throw 0;
      if(!confirm('Importar reemplaza los datos actuales de este navegador. ¿Continuar?')) return;
      S=migrate(o); persist(); UI.tab='relevar'; UI.pos=null; UI.pasillo=null; render(); toast('Respaldo importado.');
    }catch(x){ toast('El archivo no es un respaldo válido de esta herramienta.'); } t.value=''; };
    rd.readAsText(t.files[0]);
  }
});

render();
</script>
</body>
</html>
