<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relevamiento de depósito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#E4E6E8; --paper:#F4F5F6; --ink:#1B2028; --muted:#5E6875;
  --rack:#1F4E8C; --beam:#E8710A; --tape:#F2C200; --ok:#2E7D4F; --line:#C3C8CE; --danger:#B3261E;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --stencil:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.hwrap{max-width:1200px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px}
header h1{margin:0;font:700 26px/1 var(--stencil);letter-spacing:.02em}
.hstat{font-size:14px;color:#C9CED6;margin-left:auto}
nav{max-width:1200px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:#B7BEC8;padding:12px 14px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--tape)}

main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
h2{margin:0 0 6px;font:700 28px/1.1 var(--stencil);letter-spacing:.01em}
h3{margin:0 0 8px;font-size:18px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.note{background:#FFF6D6;border-left:6px solid var(--tape);padding:10px 14px;margin:0 0 16px}
.note.err{background:#FBE4E2;border-left-color:var(--danger)}

.btn{background:var(--ink);color:#fff;border:0;padding:10px 16px;font-weight:600;border-radius:3px;min-height:44px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.tape{background:var(--tape);color:var(--ink)}
.btn.danger{background:#fff;color:var(--danger);border:2px solid var(--danger)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
input,select{border:2px solid var(--line);background:#fff;padding:8px 10px;border-radius:3px;min-height:44px}
input[type=number]{width:96px}
input:focus,select:focus{border-color:var(--rack)}

/* layout table */
table{border-collapse:collapse;width:100%;max-width:640px;background:#fff}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:14px;font-weight:600;color:var(--muted)}
td.pl{font:700 26px/1 var(--stencil);width:70px}
td input{width:80px;min-height:38px;padding:4px 8px}

/* aisles */
.aisle{display:flex;gap:12px;margin:0 0 18px;align-items:stretch}
.aletter{flex:0 0 58px;background:var(--tape);color:var(--ink);font:700 54px/1 var(--stencil);display:flex;align-items:center;justify-content:center;border-radius:2px}
.ascroll{overflow-x:auto;flex:1;padding-bottom:4px}
.agrid{display:grid;gap:3px;grid-template-columns:54px repeat(var(--cols),minmax(var(--cw,46px),1fr));min-width:min-content}
.rh,.lh{font-size:12px;color:var(--muted);text-align:center;align-self:center}
.lh{text-align:right;padding-right:4px}
.pisos{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;align-items:center}
.pisos .lh{width:54px}
.pisos .cell{width:var(--cw,46px)}
.cell{min-height:40px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;border-radius:2px;padding:0;position:relative;color:var(--ink)}
.big{--cw:52px}
.big .cell{min-height:52px;font-size:15px}
.cell.un{background:repeating-linear-gradient(135deg,#D9DCE0 0 6px,#ECEEF0 6px 12px);color:var(--muted)}
.cell.vac{background:#fff;color:var(--muted)}
.cell.spl{background:#E9DDF3;color:#4B2069;border-color:#B9A0CF}
.cell.per{background:#D3ECEF;color:#0B5561;border-color:#93C4CB}
.cell.loose{box-shadow:inset 0 -6px 0 var(--tape)}
.cell.sel{outline:4px solid var(--beam);outline-offset:1px;z-index:2}
.cell.hit{outline:3px solid #000;outline-offset:1px;z-index:2}
.cell.dim{opacity:.22}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px}
.chip{flex:0 0 auto;background:#fff;border:2px solid var(--line);border-radius:3px;padding:4px 10px;min-width:64px;text-align:center}
.chip b{display:block;font:700 24px/1 var(--stencil)}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--tape)}
.chip.done small{color:var(--ok);font-weight:600}

.bar{height:10px;background:var(--concrete);border-radius:2px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}

.editor{background:#fff;border:2px solid var(--ink);padding:14px;margin-top:8px;max-width:640px}
.items{list-style:none;margin:0 0 12px;padding:0}
.items li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.items li span{flex:1}

.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin:6px 0 16px}
.kpi b{display:block;font:700 34px/1 var(--stencil)}
.kpi small{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin:0 0 14px;align-items:center;max-height:132px;overflow:auto}
.sw{display:inline-block;width:16px;height:16px;border:1px solid var(--line);vertical-align:-3px;margin-right:6px}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:6px solid var(--tape);box-shadow:0 -8px 24px rgba(0,0,0,.18);max-height:46vh;overflow:auto;padding:14px 18px}
.sheet .in{max-width:1200px;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:3px;z-index:50;max-width:90vw}
.lotes{margin:0 0 14px;padding:0;list-style:none}
.lotes li{padding:6px 0;border-bottom:1px solid var(--line)}
.det{--cw:120px}
.det .cell{display:flex;flex-direction:column;align-items:stretch;overflow:hidden;text-align:left;min-height:48px}
.det .cell.multi{background:#fff}
.det .ctr{margin:auto;text-align:center;font-size:13px;font-weight:600;padding:2px 4px}
.det .ctr small{display:block;font-weight:400;font-size:11px}
.band{flex:1;display:flex;flex-direction:column;justify-content:center;padding:3px 7px;color:#fff;min-height:46px;border-bottom:1px solid rgba(255,255,255,.4)}
.band:last-child{border-bottom:0}
.band .l1{display:flex;justify-content:space-between;gap:6px;font-size:13px;line-height:1.25}
.band .l1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band .l1 i{font-style:normal;font-weight:700}
.band .l2{font-size:11px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.band.piso{box-shadow:inset 0 -5px 0 var(--tape)}
.band.mas{background:var(--muted)}
.dash{background:#fff;border:1px solid var(--line);padding:14px 16px;margin:0 0 16px}
.dline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:16px}
.dline b{font:700 32px/1 var(--stencil)}
.dline .pend{margin-left:auto;color:var(--muted);font-size:14px}
.dprog .bar{margin:8px 0 18px}
.dgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px 32px}
.dgroup{border-top:3px solid var(--tape);padding-top:10px}
.dgroup h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.dgrid .kpi b{font-size:30px}
.dgrid .kpi small{display:block;line-height:1.25}
.band.nomatch{opacity:.3}
.planwrap{overflow:auto;background:#fff;border:1px solid var(--line);margin:0 0 12px}
.plansvg{display:block;margin:0 auto;height:auto}
.plansvg .bay{cursor:pointer}
.plansvg .bay .o{stroke:#8C959F;stroke-width:1;vector-effect:non-scaling-stroke}
.plansvg .bay.piso .o{stroke:var(--tape);stroke-width:3}
.plansvg .bay.hit .o{stroke:#000;stroke-width:3}
.plansvg .bay.sel .o,.plansvg .bay:focus-visible .o{stroke:var(--beam);stroke-width:3.5}
.plansvg .bay.dim{opacity:.22}
.plansvg .bay:focus{outline:none}
.plansvg text{font-family:var(--stencil);font-weight:700;fill:var(--ink)}
.planctl{align-items:flex-end}
.host3d{position:relative;height:min(74vh,760px);min-height:380px;background:#F4F5F6;border:1px solid var(--line);margin:0 0 12px}
.h3msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:rgba(27,32,40,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modalbox{background:#fff;max-width:420px;width:100%;padding:20px;border-radius:3px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.modalbox p{margin:0 0 16px;font-size:16px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
@media (max-width:560px){h2{font-size:24px}.aletter{flex-basis:44px;font-size:42px}}
</style>
</head>
<body>
<header>
  <div class="hwrap"><h1>Relevamiento de depósito</h1><div class="hstat" id="hstat"></div></div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="modalhost"></div>
<input type="file" id="fileimp" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ Constantes y estado ============ */
const KEY = 'deposito-v2';
const REF_TOTAL = 952;                       // referencia del calculador de capacidad (pasillos A–N + R)
const OPERADORES = ['Fabio','Jose','Leo','Temporario'];
const PCOL = ['#1F4E8C','#7B3FA0','#2E7D4F','#B5651D','#0F7C8C','#8A8F98','#A32C55','#4C6B1F'];

function defaultState(){
  const ids = 'ABCDEFGHIJKLMN'.split('').concat(['R']);
  return { v:2,
    layout:{ confirmado:false, pasillos: ids.map(id=>({id, racks:8, niveles:3, pisos:0})) },
    productos:['RUGS','MOD','Cortinas de baño','Textiles','Otro'],
    sesiones:[], activaId:null };
}
function migrate(o){
  (o.sesiones||[]).forEach(s=>Object.values(s.registros||{}).forEach(r=>{
    if(!r.tipo) r.tipo = r.vacia ? 'vacia' : 'lotes';
    delete r.vacia;
    (r.items||[]).forEach(i=>{
      if(i.lote!==undefined && i.codigo===undefined){ i.codigo=i.lote; delete i.lote; }
      if(i.ct===undefined) i.ct='';
      if(i.estado==='suelto') i.estado='piso';
    });
  }));
  return o;
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const o=JSON.parse(r); if(o&&o.v===2) return migrate(o); } }catch(e){} return null; }
let S = load() || defaultState();
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('No se pudo guardar en este navegador. Exportá un respaldo desde la pestaña Datos.'); } }

const UI = { tab: S.layout.confirmado ? 'relevar' : 'layout', pasillo:null, pos:null,
  draft:{items:[], codigo:'', ct:'', producto:'', cajas:'', estado:'pallet', comentario:''},
  mapSes:null, mapMode:'estado', mapView:'plano', planZoom:1, planNivel:0, nivel3d:'all', baseSes:null, confirmBox:null, q:'', detail:null };

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const fmt = ts => new Date(ts).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }

/* ============ Modelo de posiciones ============ */
const keyRack = (p,r,n) => `${p.id}-${pad2(r)}-N${n}`;
const keyPiso = (p,k)   => `${p.id}-P${pad2(k)}`;
const countP  = p => p.racks*p.niveles + p.pisos;
const totalPos = () => S.layout.pasillos.reduce((a,p)=>a+countP(p),0);
function keysOf(p){
  const out=[];
  for(let r=1;r<=p.racks;r++) for(let n=1;n<=p.niveles;n++) out.push(keyRack(p,r,n));
  for(let k=1;k<=p.pisos;k++) out.push(keyPiso(p,k));
  return out;
}
function allKeys(){ return S.layout.pasillos.flatMap(keysOf); }
function labelOf(key){
  const q=key.split('-');
  if(q.length===3) return `Pasillo ${q[0]} · Rack ${q[1]} · Nivel ${q[2].slice(1)}`;
  return `Pasillo ${q[0]} · Piso ${q[1].slice(1)}`;
}
const isFloorLevel = key => /-N1$/.test(key) || /-P\d+$/.test(key);

/* ============ Sesiones ============ */
const ses = () => S.sesiones.find(x=>x.id===S.activaId) || null;
function mapSession(){ return S.sesiones.find(x=>x.id===UI.mapSes) || ses() || S.sesiones[S.sesiones.length-1] || null; }
function doneCount(s, keys){ return keys.reduce((a,k)=>a+(s.registros[k]?1:0),0); }
const totalCajas = rec => rec.items.reduce((a,i)=>a+i.cajas,0);

/* ============ Grilla de pasillo ============ */
const SIN_CT='(sin CT)';
function valueOf(item, mode){
  if(mode==='codigo') return item.codigo;
  if(mode==='ct') return item.ct || SIN_CT;
  return item.producto;
}
/* Color estable por valor: se asigna en orden de aparición, así un valor no cambia de color al cargar otros nuevos */
function colorMap(s, mode){
  const m=new Map();
  if(!s || mode==='estado') return m;
  Object.values(s.registros).sort((a,b)=>a.ts-b.ts).forEach(r=>r.items.forEach(i=>{
    const v=valueOf(i,mode);
    if(!m.has(v)) m.set(v, v===SIN_CT ? '#8A8F98' : `hsl(${Math.round((m.size*137.508)%360)},58%,40%)`);
  }));
  return m;
}
function colorFor(mode, rec, cmap){
  if(!rec) return {cls:'un', style:''};
  if(rec.tipo==='vacia') return {cls:'vac', style:''};
  if(rec.tipo==='samples') return {cls:'spl', style:''};
  if(rec.tipo==='personales') return {cls:'per', style:''};
  if(mode==='estado' || !cmap) return {cls:'', style:'background:var(--rack);color:#fff'};
  const cols=[...new Set(rec.items.map(i=>valueOf(i,mode)))].map(v=>cmap.get(v)||'#888').slice(0,3);
  if(cols.length===1) return {cls:'', style:`background:${cols[0]};color:#fff`};
  const w=100/cols.length;
  const stops=cols.map((c,i)=>`${c} ${(i*w).toFixed(1)}% ${((i+1)*w).toFixed(1)}%`).join(',');
  return {cls:'', style:`background:linear-gradient(90deg,${stops});color:#fff;text-shadow:0 0 3px #000,0 0 3px #000`};
}
/* Vista Detalle: una banda por lote (hasta 3; con 4 o más: 2 bandas y "+N más") */
function bandsHTML(rec, mode, cmap, q){
  const it=rec.items, max=3;
  const show = it.length<=max ? it : it.slice(0,max-1);
  let out = show.map(i=>{
    const col = mode==='estado' ? 'var(--rack)' : (cmap&&cmap.get(valueOf(i,mode))||'#888');
    return `<span class="band${i.estado==='piso'?' piso':''}${q&&!matchItem(i,q)?' nomatch':''}" style="background:${col}"><span class="l1"><b>${esc(i.codigo)}</b><i>${i.cajas}</i></span>${i.ct?`<span class="l2">CT ${esc(i.ct)}</span>`:''}</span>`;
  }).join('');
  if(it.length>max){
    const rest=it.slice(max-1), sum=rest.reduce((a,i)=>a+i.cajas,0);
    out += `<span class="band mas"><span class="l1"><b>+${rest.length} más</b><i>${sum}</i></span></span>`;
  }
  return out;
}
function cellHTML(key, s, mode, ctx){
  const rec = s ? s.registros[key] : null;
  const c = colorFor(mode, rec, ctx.cmap);
  let cls = 'cell '+c.cls, txt = '', style = c.style;
  const det = !!ctx.detalle;
  if(rec && rec.tipo==='lotes'){
    if(det){ txt = bandsHTML(rec, mode, ctx.cmap, ctx.q); style=''; cls+=' multi'; }
    else { txt = totalCajas(rec); if(rec.items.some(i=>i.estado==='piso')) cls+=' loose'; }
  }
  else if(rec && rec.tipo==='vacia') txt = det ? '<span class="ctr">vacía</span>' : '–';
  else if(rec && rec.tipo==='samples') txt = det ? `<span class="ctr">Samples${rec.comentario?'<small>'+esc(rec.comentario)+'</small>':''}</span>` : 'S';
  else if(rec && rec.tipo==='personales') txt = det ? '<span class="ctr">Art. personales</span>' : 'AP';
  if(ctx.sel===key) cls+=' sel';
  if(ctx.hits){ cls += ctx.hits.has(key) ? ' hit' : ' dim'; }
  let title = labelOf(key);
  if(!rec) title += ' — sin relevar';
  else if(rec.tipo==='lotes') title += ' — ' + rec.items.map(i=>`${i.codigo}${i.ct?' / CT '+i.ct:''} (${i.producto}, ${i.cajas} cajas, ${i.estado==='piso'?'en piso':'en pallet'})`).join('; ');
  else if(rec.tipo==='vacia') title += ' — vacía';
  else if(rec.tipo==='samples') title += ' — samples'+(rec.comentario?': '+rec.comentario:'');
  else title += ' — artículos personales';
  return `<button class="${cls}" style="${style}" data-act="${ctx.act}" data-pos="${key}" title="${esc(title)}" aria-label="${esc(title)}">${txt}</button>`;
}
function aisleHTML(p, s, mode, ctx){
  let g = `<div class="agrid" style="--cols:${p.racks}"><span></span>`;
  for(let r=1;r<=p.racks;r++) g += `<span class="rh">${pad2(r)}</span>`;
  for(let n=p.niveles;n>=1;n--){
    g += `<span class="lh">Nivel ${n}</span>`;
    for(let r=1;r<=p.racks;r++) g += cellHTML(keyRack(p,r,n), s, mode, ctx);
  }
  g += '</div>';
  let pis = '';
  if(p.pisos>0){
    pis = '<div class="pisos"><span class="lh">Piso</span>';
    for(let k=1;k<=p.pisos;k++) pis += cellHTML(keyPiso(p,k), s, mode, ctx);
    pis += '</div>';
  }
  return `<div class="aisle${ctx.detalle?' det':''}"><div class="aletter" aria-label="Pasillo ${p.id}">${esc(p.id)}</div><div class="ascroll">${g}${pis}</div></div>`;
}

/* ============ Render principal ============ */
const TABS = [['layout','Layout'],['relevar','Relevar'],['mapa','Mapa'],['datos','Datos']];
function askConfirm(msg, then, yesLabel){ UI.confirmBox={msg, then, yes:yesLabel}; render(); }
function modalHTML(){
  if(!UI.confirmBox) return '';
  return `<div class="modalbg" data-act="confirmNo"><div class="modalbox"><p>${esc(UI.confirmBox.msg)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn alt" data-act="confirmNo">Cancelar</button><button class="btn danger" data-act="confirmYes">${esc(UI.confirmBox.yes||'Confirmar')}</button></div></div></div>`;
}
function render(){
  $('#tabs').innerHTML = TABS.map(([id,t])=>`<button role="tab" aria-selected="${UI.tab===id}" data-act="tab" data-tab="${id}">${t}</button>`).join('');
  const s=ses();
  $('#hstat').textContent = s ? `Relevando: ${s.operador} · desde ${fmt(s.inicio)}` : 'Sin relevamiento en curso';
  $('#app').innerHTML = ({layout:viewLayout, relevar:viewRelevar, mapa:viewMapa, datos:viewDatos})[UI.tab]();
  const mh=$('#modalhost'); if(mh) mh.innerHTML=modalHTML();
  if(UI.tab==='mapa') post3D();
  if(UI.tab==='relevar' && UI.pos){ const e=$('#editor'); if(e) e.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}

/* ============ Vista: Layout ============ */
function layoutSummary(){
  const t=totalPos(), d=t-REF_TOTAL;
  return `<b>${t}</b> posiciones en total. Referencia del calculador de capacidad: ${REF_TOTAL}. ` +
    (d===0 ? '<span style="color:var(--ok);font-weight:600">Coincide.</span>' : `Diferencia: ${d>0?'+':''}${d}.`);
}
function viewLayout(){
  const L=S.layout;
  const rows = L.pasillos.map((p,i)=>`<tr>
    <td class="pl">${esc(p.id)}</td>
    <td><input type="number" min="1" max="80" value="${p.racks}" data-lay="${i}" data-f="racks" aria-label="Racks pasillo ${p.id}"></td>
    <td><input type="number" min="1" max="12" value="${p.niveles}" data-lay="${i}" data-f="niveles" aria-label="Niveles pasillo ${p.id}"></td>

function lotesIndex(s){

/* ============ Vista 3D (Three.js, se carga solo al usarla) ============ */
const LVL=2;                  /* altura de cada nivel, en metros */
const BH=LVL-0.3;             /* alto del bloque; el resto es la viga entre niveles */
const G3={ready:false,loading:false,failed:false,viewSet:false};
let MAPCTX=null;
function planGeom(){
  const P=PLAN,d=P.prof; let x=0; const X={};
  P.orden.forEach(([id,g])=>{ x+=g; X[id]=x; x+=d; });
  return {X,W:x,top:d+P.circ,H:d+P.circ+P.largo};
}
/* Descriptores de bloques (sin depender de Three.js): un bloque por nivel de cada rack; hasta 3 tramos si hay varios valores */
function cells3D(){
  const ctx=MAPCTX; if(!ctx||!ctx.s) return [];
  const {s,mode,cmap,hits}=ctx, P=PLAN, d=P.prof, {X,W,top}=planGeom(), out=[];
  const byId=new Map(S.layout.pasillos.map(p=>[p.id,p]));
  const v=UI.nivel3d, k=+v.slice(1);
  const vis=n=> v==='all' ? true : (v[0]==='s' ? n===k : n<=k);
  const add=(p,r,x0,z0,w,dd,isRow)=>{
    for(let n=1;n<=p.niveles;n++){
      if(!vis(n)) continue;
      const key=keyRack(p,r,n), rec=s.registros[key];
      let parts, edge='#2B3440';
      if(!rec){ parts=[{c:'#C9CED4',o:.3}]; edge='#9AA3AD'; }
      else if(rec.tipo==='vacia') parts=[{c:'#FFFFFF',o:.9}];
      else if(rec.tipo==='samples') parts=[{c:'#B99BD6',o:1}];
      else if(rec.tipo==='personales') parts=[{c:'#7CC3CC',o:1}];
      else if(mode==='estado') parts=[{c:'#1F4E8C',o:1}];
      else parts=[...new Set(rec.items.map(i=>valueOf(i,mode)))].slice(0,3).map(val=>({c:cmap.get(val)||'#888888',o:1}));
      if(rec && rec.tipo==='lotes' && rec.items.some(i=>i.estado==='piso')) edge='#F2C200';
      const dim = hits ? !hits.has(key) : false;
      const cy=(n-1)*LVL+0.25+BH/2, sw=w-0.08, sd=dd-0.08, np=parts.length;
      parts.forEach((pt,i)=>{
        const long = isRow ? sd/np : sw/np;
        out.push({key, sel:UI.detail===key, dim, edge, color:pt.c, opacity: dim ? .1 : pt.o,
          x: isRow ? x0+w/2 : x0+0.04+long*i+long/2,
          z: isRow ? z0+0.04+long*i+long/2 : z0+dd/2,
          y: cy, w: isRow ? sw : long, h: BH, d: isRow ? long : sd});
      });
    }
  };
  P.orden.forEach(([id])=>{
    const p=byId.get(id); if(!p) return; const bl=P.largo/p.racks;
    for(let r=1;r<=p.racks;r++) add(p,r,X[id],top+(p.racks-r)*bl,d,bl,true);
  });
  const R=byId.get('R');
  if(R){ const bl=Math.min(P.bayR,W/R.racks); for(let r=1;r<=R.racks;r++) add(R,r,(r-1)*bl,0,bl,d,false); }
  return out;
}
function loadThree(){
  if(window.THREE) return Promise.resolve();
  return new Promise((res,rej)=>{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    sc.onload=res; sc.onerror=()=>rej(new Error('three')); document.head.appendChild(sc);
  });
}
function init3D(){
  const T=THREE, renderer=new T.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0xF4F5F6);
  const scene=new T.Scene(), camera=new T.PerspectiveCamera(45,1,0.5,600);
  scene.add(new T.AmbientLight(0xffffff,0.62));
  const dl=new T.DirectionalLight(0xffffff,0.5); dl.position.set(-30,70,50); scene.add(dl);
  const group=new T.Group(); scene.add(group);
  Object.assign(G3,{renderer,scene,camera,group,canvas:renderer.domElement,pick:[],geo:new Map(),edg:new Map(),mat:new Map(),lmat:new Map(),tex:new Map(),raf:0,
    cam:{theta:.55,phi:1.0,r:80,target:new T.Vector3(18,2,24)}});
  G3.canvas.style.cssText='display:block;width:100%;height:100%;touch-action:none';
  attachControls();
  window.addEventListener('resize',()=>{ if(G3.canvas.isConnected) resize3D(); });
  G3.ready=true;
}
function draw3D(){
  if(!G3.ready||G3.raf) return;
  G3.raf=requestAnimationFrame(()=>{
    G3.raf=0; if(!G3.canvas.isConnected) return;
    const c=G3.cam, sp=Math.sin(c.phi);
    G3.camera.position.set(c.target.x+c.r*sp*Math.sin(c.theta), c.target.y+c.r*Math.cos(c.phi), c.target.z+c.r*sp*Math.cos(c.theta));
    G3.camera.lookAt(c.target);
    G3.renderer.render(G3.scene,G3.camera);
  });
}
function resize3D(){
  const host=G3.canvas.parentElement; if(!host) return;
  const w=host.clientWidth, h=host.clientHeight; if(!w||!h) return;
  G3.renderer.setSize(w,h,false); G3.camera.aspect=w/h; G3.camera.updateProjectionMatrix(); draw3D();
}
function setCam(v){
  const c=G3.cam, {W,H}=planGeom(), t=Math.tan(22.5*Math.PI/180), asp=G3.camera.aspect||1;
  const fit=Math.max((H/2)/t,(W/2)/(t*asp))*1.1;
  c.target.set(W/2, v==='top'?0:LVL*1.2, H/2);
  if(v==='top'){ c.theta=0; c.phi=0.04; c.r=fit; }
  else if(v==='side'){ c.theta=Math.PI/2; c.phi=1.45; c.r=Math.max(H/2/t, W/2/(t*asp))*1.1; }
  else { c.theta=.55; c.phi=1.0; c.r=fit*1.2; }
  draw3D();
}
function label3D(text){
  if(G3.tex.has(text)) return G3.tex.get(text);
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const g=cv.getContext('2d'); g.font='bold 96px "Barlow Condensed","Arial Narrow",Arial,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#1B2028'; g.fillText(text,64,68);
  const tx=new THREE.CanvasTexture(cv); G3.tex.set(text,tx); return tx;
}
function rebuild3D(){
  if(!G3.ready) return;
  const T=THREE, g=G3.group;
  while(g.children.length) g.remove(g.children[0]);
  G3.pick=[];
  const {W,H,X}=planGeom();
  const fl=new T.Mesh(new T.PlaneGeometry(W+2,H+4), new T.MeshBasicMaterial({color:0xE4E6E8}));
  fl.rotation.x=-Math.PI/2; fl.position.set(W/2,-0.03,(H+4)/2-1); g.add(fl);
  const sprite=(text,x,z)=>{ const sp=new T.Sprite(new T.SpriteMaterial({map:label3D(text),transparent:true,depthTest:false})); sp.scale.set(3,3,1); sp.position.set(x,0.3,z); g.add(sp); };
  PLAN.orden.forEach(([id])=>{ if(S.layout.pasillos.some(p=>p.id===id)) sprite(id,X[id]+PLAN.prof/2,H+2.4); });
  if(S.layout.pasillos.some(p=>p.id==='R')) sprite('R',-1.8,PLAN.prof/2);
  cells3D().forEach(c=>{
    const gk=`${c.w.toFixed(3)}|${c.d.toFixed(3)}`;
    let geo=G3.geo.get(gk); if(!geo){ geo=new T.BoxGeometry(c.w,c.h,c.d); G3.geo.set(gk,geo); G3.edg.set(gk,new T.EdgesGeometry(geo)); }
    const mk=`${c.color}|${c.opacity}|${c.sel}`;
    let mat=G3.mat.get(mk);
    if(!mat){ mat=new T.MeshLambertMaterial({color:c.color,transparent:c.opacity<1,opacity:c.opacity,depthWrite:c.opacity>=.85,emissive:c.sel?0x7A3A05:0x000000}); G3.mat.set(mk,mat); }
    const lk=`${c.sel?'#E8710A':c.edge}|${c.dim}`;
    let lm=G3.lmat.get(lk); if(!lm){ lm=new T.LineBasicMaterial({color:c.sel?'#E8710A':c.edge,transparent:true,opacity:c.dim?.12:.85}); G3.lmat.set(lk,lm); }
    const m=new T.Mesh(geo,mat); m.position.set(c.x,c.y,c.z); m.userData={key:c.key};
    m.add(new T.LineSegments(G3.edg.get(gk),lm));
    g.add(m); G3.pick.push(m);
  });
  draw3D();
}
function pick3D(e){
  const r=G3.canvas.getBoundingClientRect();
  const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  const rc=new THREE.Raycaster(); rc.setFromCamera(v,G3.camera);
  const hit=rc.intersectObjects(G3.pick,false)[0];
  UI.detail = hit ? hit.object.userData.key : null;
  refreshMap();
}
function attachControls(){
  const el=G3.canvas, c=G3.cam, ptrs=new Map(); let moved=0, lastDist=0, lastMid=null;
  const clampR=x=>Math.min(250,Math.max(8,x));
  const rot=(dx,dy)=>{ c.theta-=dx*0.006; c.phi=Math.min(1.5,Math.max(0.04,c.phi-dy*0.006)); };
  const pan=(dx,dy)=>{ const k=c.r*0.0016, st=Math.sin(c.theta), ct=Math.cos(c.theta);
    c.target.x+=-ct*dx*k-st*dy*k; c.target.z+=st*dx*k-ct*dy*k; };
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{
    if(el.setPointerCapture) el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0;
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y); lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
  });
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId); if(!p) return;
    if(ptrs.size===1){
      const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
      if((e.buttons&2)||e.shiftKey) pan(dx,dy); else rot(dx,dy);
    } else if(ptrs.size===2){
      p.x=e.clientX; p.y=e.clientY;
      const [a,b]=[...ptrs.values()], dist=Math.hypot(a.x-b.x,a.y-b.y), mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(lastDist&&dist) c.r=clampR(c.r*lastDist/dist);
      if(lastMid) pan(mid.x-lastMid.x,mid.y-lastMid.y);
      lastDist=dist; lastMid=mid; moved+=10;
    }
    draw3D();
  });
  const up=e=>{
    const click = e.type==='pointerup' && ptrs.size===1 && ptrs.has(e.pointerId) && moved<6;
    ptrs.delete(e.pointerId); if(ptrs.size<2){ lastDist=0; lastMid=null; }
    if(click) pick3D(e);
  };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{ e.preventDefault(); c.r=clampR(c.r*Math.exp(e.deltaY*0.0012)); draw3D(); },{passive:false});
}
function post3D(){

/* ============ Plano: vista desde arriba, a escala (metros) ============ */
/* Filas A–N: paralelas, 42 m de largo. Separaciones según el esquema vigente. Profundidad de rack: estimada por diferencia (36 m de ancho), a confirmar. */
const PLAN={
  largo:42, circ:4, prof:1.27, bayR:3.5,
  orden:[['A',0],['B',2.07],['C',0],['D',2.00],['E',0],['F',1.66],['G',0],['H',1.66],['I',0],['J',1.63],['K',0],['L',1.74],['M',0],['N',7.50]]
};
function bayInfo(p,r,s){
  const nv=UI.planNivel;
  if(nv>p.niveles) return {na:true,rel:0,occ:0,piso:false,items:[],esp:new Set(),total:0};
  let rel=0, occ=0, piso=false; const items=[], esp=new Set();
  for(let n=(nv||1);n<=(nv||p.niveles);n++){
    const rec=s.registros[keyRack(p,r,n)]; if(!rec) continue; rel++;
    if(rec.tipo==='lotes'){ occ++; rec.items.forEach(i=>{ items.push(i); if(i.estado==='piso') piso=true; }); }
    else if(rec.tipo!=='vacia') esp.add(rec.tipo);
  }
  return {rel,occ,piso,items,esp,total:nv?1:p.niveles};
}
function bayFill(info, mode, cmap){
  if(info.na) return 'na';
  if(info.rel===0) return 'hatch';
  if(info.items.length){
    if(mode==='estado') return [{c:'#1F4E8C',o:.35+.65*info.occ/info.total}];
    return [...new Set(info.items.map(i=>valueOf(i,mode)))].map(v=>({c:cmap.get(v)||'#888',o:1})).slice(0,3);
  }
  if(info.esp.has('samples')) return [{c:'#E9DDF3',o:1}];
  if(info.esp.has('personales')) return [{c:'#D3ECEF',o:1}];
  return [];
}
function bayHTML(p,r,x,y,w,h,s,mode,cmap,hb){
  const f=v=>v.toFixed(3), id=`${p.id}-${pad2(r)}`, info=bayInfo(p,r,s), fill=bayFill(info,mode,cmap);
  let g=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="#fff"/>`;
  if(fill==='na') g+=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="#E6E8EB"/>`;
  else if(fill==='hatch') g+=`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="url(#hatch)"/>`;
  else { const vert=h>=w, n=fill.length;
    fill.forEach((c,i)=>{ const sx=vert?x:x+w/n*i, sy=vert?y+h/n*i:y, sw=vert?w:w/n, sh=vert?h/n:h;
      g+=`<rect x="${f(sx)}" y="${f(sy)}" width="${f(sw)}" height="${f(sh)}" fill="${c.c}" fill-opacity="${c.o.toFixed(2)}"/>`; }); }
  g+=`<rect class="o" x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" fill="none"/>`;
  let cls='bay'; if(info.piso) cls+=' piso'; if(hb) cls+=hb.has(id)?' hit':' dim'; if(UI.detail==='bay:'+id) cls+=' sel';
  const nv=UI.planNivel, rk=`Pasillo ${p.id} · Rack ${pad2(r)}`;
  const t = info.na ? `${rk}: no tiene Nivel ${nv}`
    : nv ? `${rk} · Nivel ${nv}: ${info.rel?(info.occ?'con mercadería':'sin mercadería'):'sin relevar'}`
    : `${rk}: ${info.occ} de ${info.total} niveles con mercadería (${info.rel} relevados)`;
  return `<g class="${cls}" data-act="bay" data-pos="${id}" tabindex="0" role="button" aria-label="${esc(t)}"><title>${esc(t)}</title>${g}</g>`;
}
function planHTML(s, mode, cmap, hits){
  const P=PLAN, d=P.prof; let x=0; const X={};
  P.orden.forEach(([id,g])=>{ x+=g; X[id]=x; x+=d; });
  const W=x, top=d+P.circ, H=top+P.largo, byId=new Map(S.layout.pasillos.map(p=>[p.id,p]));
  const hb = hits ? new Set([...hits].filter(k=>k.split('-').length===3 && (!UI.planNivel || k.endsWith('-N'+UI.planNivel))).map(k=>k.split('-').slice(0,2).join('-'))) : null;
  let svg=`<defs><pattern id="hatch" width="0.9" height="0.9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="0.9" height="0.9" fill="#ECEEF0"/><line x1="0" y1="0" x2="0" y2="0.9" stroke="#D3D7DB" stroke-width="0.45"/></pattern></defs>`;
  svg+=`<rect x="-1" y="-1" width="${(W+2).toFixed(2)}" height="${(H+4).toFixed(2)}" fill="#F4F5F6" stroke="#C3C8CE" stroke-width="0.12"/>`;
  P.orden.forEach(([id])=>{
    const p=byId.get(id); if(!p) return; const bl=P.largo/p.racks;
    for(let r=1;r<=p.racks;r++){
      const y = top + (p.racks-r)*bl;   /* Rack 01 siempre abajo, en el extremo opuesto a R */
      svg+=bayHTML(p,r,X[id],y,d,bl,s,mode,cmap,hb);
    }
    svg+=`<text x="${(X[id]+d/2).toFixed(2)}" y="${(H+1.9).toFixed(2)}" font-size="1.6" text-anchor="middle">${esc(id)}</text>`;
  });
  const R=byId.get('R');
  if(R){
    const bl=Math.min(P.bayR, W/R.racks);
    for(let r=1;r<=R.racks;r++) svg+=bayHTML(R,r,(r-1)*bl,0,bl,d,s,mode,cmap,hb);
    svg+=`<text x="-0.4" y="${(d*0.5+0.55).toFixed(2)}" font-size="1.6" text-anchor="end">R</text>`;
  }
  const ratio=(W+3)/(H+5), z=UI.planZoom;
  const svgStyle = z===1 ? `width:100%;max-width:calc(78vh * ${ratio.toFixed(3)})` : `width:${z*100}%`;
  const pisos=S.layout.pasillos.filter(p=>p.pisos>0).map(p=>`<div class="pisos"><span class="lh" style="width:auto;padding-right:8px">Pasillo ${esc(p.id)} · Piso</span>${Array.from({length:p.pisos},(_,i)=>cellHTML(keyPiso(p,i+1),s,mode,{act:'detail',cmap,hits,sel:UI.detail})).join('')}</div>`).join('');
  const sin=S.layout.pasillos.filter(p=>p.id!=='R' && !P.orden.some(([id])=>id===p.id)).map(p=>p.id);
  const maxN=Math.max(1,...S.layout.pasillos.map(q=>q.niveles));
  const nivOpts=`<option value="0" ${UI.planNivel===0?'selected':''}>Todos juntos</option>`+Array.from({length:maxN},(_,i)=>`<option value="${i+1}" ${UI.planNivel===i+1?'selected':''}>Solo Nivel ${i+1}</option>`).join('');
  return `<div class="row planctl">
      <label class="f">Niveles<select id="m-nivel">${nivOpts}</select></label>
      <button class="btn alt sm" data-act="zoom" data-d="-1" aria-label="Alejar">−</button>
      <button class="btn alt sm" data-act="zoom" data-d="1" aria-label="Acercar">+</button>
      <button class="btn alt sm" data-act="zoomfit">Ver todo</button>
    </div>
    <div class="planwrap" ${z>1?'style="max-height:82vh"':''}><svg class="plansvg" style="${svgStyle}" viewBox="-1.5 -1.5 ${(W+3).toFixed(2)} ${(H+5).toFixed(2)}" role="group" aria-label="Plano del depósito visto desde arriba">${svg}</svg></div>
    <p class="muted">Cada bloque es un rack visto desde arriba. Con Todos juntos se colorea con lo que hay en sus niveles; con un nivel elegido, solo con lo de ese nivel. En Estado, el azul es más intenso cuanto más niveles ocupados tiene. Borde amarillo: el rack tiene mercadería en piso. Tocá un rack para ver nivel por nivel. Los racks se numeran desde abajo: el 01 está en el extremo opuesto a R. Escala: filas de 42 m y ancho de unos ${Math.round(W)} m; la profundidad de rack (${String(P.prof).replace('.',',')} m) es estimada y está por confirmar.</p>
    ${pisos}
    ${sin.length?`<div class="note">Pasillos que todavía no tienen lugar en el plano: ${sin.map(esc).join(', ')}. Se ven en las vistas Detalle y Compacto.</div>`:''}`;
}

function matchItem(i,q){ return !q || i.codigo.toUpperCase().includes(q) || (i.ct||'').toUpperCase().includes(q); }
function mapBodyHTML(){
  const s=mapSession(); if(!s) return '';

  }
  const kp=(n,l)=>`<div class="kpi"><b>${n}</b><small>${l}</small></div>`;
  const panel=`<section class="dash">
    <div class="dprog">

    </div>
    <div class="dgroups">
      <div class="dgroup"><h3>Posiciones relevadas</h3><div class="dgrid">${kp(occ,'con mercadería')}${kp(vac,'vacías')}${kp(spl,'con samples')}${kp(per,'con artículos personales')}</div></div>
      <div class="dgroup"><h3>Mercadería</h3><div class="dgrid">${kp(cajas,'cajas contadas')}${kp(idx.size,'lotes distintos')}${kp(frag,'lotes en más de una posición')}${kp(enPiso,'posiciones con mercadería en piso')}</div></div>
    </div>
  </section>`;
  let legend='';
  if(UI.mapMode==='estado') legend=`<span><i class="sw" style="background:var(--rack)"></i>Con mercadería</span><span><i class="sw" style="background:#fff"></i>Vacía</span><span><i class="sw" style="background:repeating-linear-gradient(135deg,#D9DCE0 0 4px,#ECEEF0 4px 8px)"></i>Sin relevar</span><span><i class="sw" style="box-shadow:inset 0 -6px 0 var(--tape)"></i>Mercadería en piso</span>`;
  else {
    const nom={ct:'CT',codigo:'código',producto:'producto'}[UI.mapMode];
    legend=`<span class="muted">Un color por ${nom}. Si una posición tiene varios, se divide en franjas (hasta 3).</span>`+[...cmap].map(([v,c])=>`<span><i class="sw" style="background:${c}"></i>${esc(v)}</span>`).join('');
  }
  legend+=`<span><i class="sw" style="background:#E9DDF3"></i>Samples (S)</span><span><i class="sw" style="background:#D3ECEF"></i>Artículos personales (AP)</span>`;
  MAPCTX={s,mode:UI.mapMode,cmap,hits};
  const aisles=S.layout.pasillos.map(p=>aisleHTML(p,s,UI.mapMode,{act:'detail',cmap,hits,q,sel:UI.detail,detalle:UI.mapView==='detalle'})).join('');
  return `${panel}
  ${found}
  <div class="legend">${legend}</div>
  ${UI.mapView==='plano' ? planHTML(s,UI.mapMode,cmap,hits) : UI.mapView==='3d' ? view3dHTML() : aisles}

function detailHTML(s){

function download(name, text, mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportCSV(){
  const s=mapSession(); if(!s){ toast('No hay relevamientos para exportar.'); return; }
  const rows=[['relevamiento','responsable','posicion','pasillo','rack','nivel','tipo','estado_posicion','codigo','ct','producto','cajas','estado_mercaderia','comentario','fecha']];
  const ETQ={vacia:'vacia',samples:'samples',personales:'articulos personales'};
  allKeys().forEach(k=>{
    const q=k.split('-'), rack=q.length===3, rec=s.registros[k];
    const base=[fmt(s.inicio),s.operador,k,q[0],rack?q[1]:'',rack?q[2].slice(1):'',rack?'rack':'piso'];
    if(!rec) rows.push([...base,'sin relevar','','','','','','','']);
    else if(rec.tipo!=='lotes') rows.push([...base,ETQ[rec.tipo],'','','','','',rec.comentario||'',fmt(rec.ts)]);
    else rec.items.forEach(i=>rows.push([...base,'ocupada',i.codigo,i.ct||'',i.producto,i.cajas,i.estado==='piso'?'en piso':'en pallet','',fmt(rec.ts)]));
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download(`relevamiento_${new Date(s.inicio).toISOString().slice(0,10)}_${s.operador}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');
}

/* ============ Acciones de relevamiento ============ */
function selectPos(key){
  UI.pos=key; const rec=ses().registros[key];
  UI.draft={items: rec&&rec.tipo==='lotes' ? rec.items.map(i=>({...i})) : [], codigo:'', ct:'', producto:'', cajas:'', estado:'pallet',
            comentario: rec&&rec.tipo==='samples' ? (rec.comentario||'') : ''};
  render();
}
function addItem(silent){
  const d=UI.draft, codigo=d.codigo.trim().toUpperCase(), ct=d.ct.trim().toUpperCase(), cajas=parseInt(d.cajas,10);
  let prod=d.producto.trim();
  if(!codigo){ if(!silent) toast('Falta el código.'); return false; }
  if(!prod){ if(!silent) toast('Falta el producto.'); return false; }
  if(!(cajas>0)){ if(!silent) toast('La cantidad de cajas debe ser mayor a 0.'); return false; }
  const ex=S.productos.find(p=>p.toLowerCase()===prod.toLowerCase());
  if(ex) prod=ex; else { S.productos.push(prod); persist(); }
  const ya=lotesIndex(ses()).get(codigo);
  d.items.push({codigo,ct,producto:prod,cajas,estado:d.estado});
  d.codigo=''; d.ct=''; d.cajas='';
  if(ya && !(ya.pos.size===1 && ya.pos.has(UI.pos))) toast(`El código ${codigo} ya figura en ${ya.pos.size} posición${ya.pos.size>1?'es':''} de este relevamiento. Se registra como lote repartido.`);
  return true;
}
function doMarkSpecial(tipo){
  const d=UI.draft, rec={tipo,items:[],ts:Date.now()};
  if(tipo==='samples') rec.comentario=d.comentario.trim();
  ses().registros[UI.pos]=rec; persist(); nextPos();
}
function markSpecial(tipo){
  if(UI.draft.items.length){ askConfirm('Hay lotes cargados sin guardar en esta posición. Si marcás otra opción se descartan. ¿Continuar?', ()=>doMarkSpecial(tipo), 'Continuar'); return; }
  doMarkSpecial(tipo);
}
function nextPos(){
  const s=ses(), p=S.layout.pasillos.find(x=>x.id===UI.pasillo), ks=keysOf(p);
  const i=ks.indexOf(UI.pos);
  let nk=ks.slice(i+1).find(k=>!s.registros[k]) || ks.find(k=>!s.registros[k]);
  if(!nk){ const fp=firstPending(s); if(fp){ UI.pasillo=fp.p; nk=fp.k; } }
  if(nk){ selectPos(nk); }
  else { UI.pos=null; render(); toast('Relevamiento completo. Podés cerrarlo.'); }
}

document.addEventListener('click', e=>{

    case 'aplicarTodos': {
      const r=+$('#b-racks').value, n=+$('#b-niv').value, p=+$('#b-pisos').value;
      if(!(r>=1&&n>=1&&p>=0)){ toast('Revisá los valores.'); break; }
      L.pasillos.forEach(x=>{x.racks=r;x.niveles=n;x.pisos=p;}); L.confirmado=false; persist(); render(); break; }
    case 'addPasillo': {
      const id=$('#np-id').value.trim().toUpperCase().replace(/[^A-Z0-9Ñ]/g,'');
      if(!id){ toast('Ingresá el nombre del pasillo (letras o números, sin guiones).'); break; }
      if(L.pasillos.some(x=>x.id===id)){ toast('Ese pasillo ya existe.'); break; }
      L.pasillos.push({id,racks:8,niveles:3,pisos:0}); L.confirmado=false; persist(); render(); break; }
    case 'delPasillo': {
      const i=+b.dataset.i;
      const quitar=()=>{ L.pasillos.splice(i,1); L.confirmado=false; persist(); render(); };
      if(S.sesiones.length){ askConfirm('Hay relevamientos guardados. ¿Quitar el pasillo igual?', quitar, 'Quitar'); break; }
      quitar(); break; }
    case 'confirmLayout':
      if(!L.pasillos.length){ toast('Agregá al menos un pasillo.'); break; }
      L.confirmado=true; persist(); UI.tab='relevar'; render(); break;
    case 'iniciar': {
      const sel=document.querySelector('input[name="base"]:checked'), hist=S.sesiones.slice().reverse();
      const last = hist.find(x=>x.fin) || hist[0];
      const copiar = last && (!sel || sel.value==='last');
      let registros={};
      if(copiar){ Object.entries(last.registros).forEach(([k,r])=>{ registros[k]={...r, items:r.items?r.items.map(i=>({...i})):[]}; registros[k].copiada=true; }); }
      const s={id:'s'+Date.now(), operador:$('#op').value, inicio:Date.now(), fin:null, registros, origen: copiar?last.id:null};
      S.sesiones.push(s); S.activaId=s.id; UI.pos=null; UI.pasillo=null; UI.baseSes=null; persist(); render();
      if(copiar) toast('Se copiaron las posiciones del último relevamiento. Revisá y corregí lo que haya cambiado.');
      break; }
    case 'cerrar': {
      const s=ses(), pend=allKeys().length-doneCount(s,allKeys());
      askConfirm(pend?`Quedan ${pend} posiciones sin relevar. ¿Cerrar igual?`:'¿Cerrar el relevamiento?',
        ()=>{ s.fin=Date.now(); UI.mapSes=s.id; S.activaId=null; UI.pos=null; persist(); UI.tab='mapa'; render(); }, 'Cerrar');
      break; }
    case 'pasillo': UI.pasillo=b.dataset.id; UI.pos=null; render(); break;
    case 'pick': selectPos(b.dataset.pos); break;
    case 'addItem': if(addItem()) render(); break;
    case 'delItem': UI.draft.items.splice(+b.dataset.i,1); render(); break;
    case 'guardar': {
      const d=UI.draft;
      if(d.codigo.trim() || d.ct.trim() || d.cajas){ if(!addItem()) break; }
      if(!d.items.length){ toast('Cargá al menos un lote, o marcá la posición como vacía.'); break; }
      ses().registros[UI.pos]={tipo:'lotes',items:d.items.map(i=>({...i})),ts:Date.now()};
      persist(); nextPos(); break; }
    case 'vacia': markSpecial('vacia'); break;
    case 'samples': markSpecial('samples'); break;
    case 'personales': markSpecial('personales'); break;
    case 'borrar':
      delete ses().registros[UI.pos]; persist(); selectPos(UI.pos); break;
    case 'detail': UI.detail=b.dataset.pos; refreshMap(); break;
    case 'bay': UI.detail='bay:'+b.dataset.pos; refreshMap(); break;
    case 'zoom': { const Z=[1,1.5,2,3,4]; let i=Z.indexOf(UI.planZoom); if(i<0) i=0; i=Math.min(Z.length-1,Math.max(0,i+(+b.dataset.d))); UI.planZoom=Z[i]; refreshMap(); break; }
    case 'cam': if(G3.ready) setCam(b.dataset.v); break;
    case 'zoomfit': UI.planZoom=1; refreshMap(); break;
    case 'closeDetail': UI.detail=null; refreshMap(); break;
    case 'exportJSON': download(`deposito_respaldo_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,1),'application/json'); break;
    case 'exportCSV': exportCSV(); break;
    case 'importJSON': $('#fileimp').click(); break;
    case 'reset':
      askConfirm('Esto borra todo y no se puede deshacer. ¿Continuar?', ()=>{ try{localStorage.removeItem(KEY);}catch(x){} S=defaultState(); UI.tab='layout'; UI.pos=null; UI.pasillo=null; render(); }, 'Borrar todo');
      break;
    case 'confirmYes': { const cb=UI.confirmBox&&UI.confirmBox.then; UI.confirmBox=null; if(cb) cb(); else render(); break; }
    case 'confirmNo': UI.confirmBox=null; render(); break;
  }
});

document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.d && t.dataset.d!=='estado'){ UI.draft[t.dataset.d]=t.value; }
  if(t.id==='m-q'){ UI.q=t.value; refreshMap(); }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.lay!==undefined){
    const i=+t.dataset.lay, f=t.dataset.f, lim={racks:[1,80],niveles:[1,12],pisos:[0,200]}[f];
    let v=parseInt(t.value,10); if(isNaN(v)) v=lim[0]; v=Math.min(lim[1],Math.max(lim[0],v)); t.value=v;
    S.layout.pasillos[i][f]=v; S.layout.confirmado=false; persist();
    $('#lp-'+i).textContent=countP(S.layout.pasillos[i]); $('#lay-total').innerHTML=layoutSummary();
  }
  if(t.dataset.d==='estado') UI.draft.estado=t.value;
  if(t.id==='m-ses'){ UI.mapSes=t.value; UI.detail=null; refreshMap(); }
  if(t.id==='m-nivel'){ UI.planNivel=+t.value; refreshMap(); }
  if(t.id==='m-nivel3'){ UI.nivel3d=t.value; refreshMap(); }
  if(t.id==='m-view'){ UI.mapView=t.value; refreshMap(); }
  if(t.id==='m-mode'){ UI.mapMode=t.value; refreshMap(); }
  if(t.id==='fileimp' && t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const o=JSON.parse(rd.result);
      if(!o||o.v!==2||!o.layout||!Array.isArray(o.sesiones)) throw 0;
      askConfirm('Importar reemplaza los datos actuales de este navegador. ¿Continuar?',
        ()=>{ S=migrate(o); persist(); UI.tab='relevar'; UI.pos=null; UI.pasillo=null; render(); toast('Respaldo importado.'); }, 'Importar');
    }catch(x){ toast('El archivo no es un respaldo válido de esta herramienta.'); } t.value=''; };
    rd.readAsText(t.files[0]);
  }
});

document.addEventListener('keydown', e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ') && t.matches && t.matches('g[data-act="bay"]')){ e.preventDefault(); t.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});

render();
</script>
</body>
</html>
